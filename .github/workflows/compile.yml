name: Compilar APK WearOS

# Cancelar ejecuciones antiguas automáticamente
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
    && (github.event.inputs.motivo != 'Autodetectar' && github.event.inputs.motivo != ''
      && format('Manual: {0}', github.event.inputs.motivo)
      || 'Compilación manual (Web)'
    )
    || format('Commit: {0} ({1})', github.event.head_commit.message, github.event.commits[0].modified[0] || github.event.commits[0].added[0] || 'Varios archivos')
  }}
  
on:
  push:
    branches: [ "test" ] # Se ejecutará automáticamente al guardar aquí

  workflow_dispatch:
    inputs:
      motivo:
        description: "Título de la ejecución"
        required: false
        default: "Autodetectar"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4.2.2
        
    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Entorno Oficial de Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.6"

    - name: Compilar APK (Debug)
      run: gradle assembleDebug --no-daemon

    - name: Renombrar archivo APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FullDigitalClock.apk

    - name: Firmar APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        # Esto fuerza a la acción a buscar el ejecutable zipalign dentro del SDK oficial de la máquina virtual
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Limpiar nombre del APK firmado
      run: mv app/build/outputs/apk/debug/FullDigitalClock-signed.apk app/build/outputs/apk/debug/FullDigitalClock.apk
      
    - name: Guardar y mostrar el APK generado
      uses: actions/upload-artifact@v4
      with:
        name: Full Digital Clock
        path: "app/build/outputs/apk/debug/FullDigitalClock.apk"
        retention-days: 1
        if-no-files-found: error
