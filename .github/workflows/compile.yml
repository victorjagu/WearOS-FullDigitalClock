name: Compilar APK WearOS

# Cancelar ejecuciones antiguas automáticamente
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
    && (
      github.event.inputs.motivo != ''
      && format('Manual: {0}', github.event.inputs.motivo)
      || 'Compilación manual'
    )
    || format('Commit: {0}', github.event.head_commit.message)
  }}
  
on:
  push:
    branches: [ "test" ] # Se ejecutará automáticamente al guardar aquí

  workflow_dispatch:
    inputs:
      motivo:
        description: "Título de la ejecución"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4 # Soluciona aviso de Node 20

    - name: Configurar Java 17
      uses: actions/setup-java@v5 # Versión recomendada para entornos Node 24
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Entorno Oficial de Gradle
      uses: gradle/actions/setup-gradle@v4.1.0 # Soluciona aviso de set-output
      with:
        gradle-version: "8.6"
        cache-disabled: true

    - name: Compilar APK (Debug)
      # Forzamos el uso de gradle global ya que no usaremos el wrapper ./gradlew
      run: gradle assembleDebug --no-daemon

    - name: Renombrar archivo APK
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FullDigitalClock.apk

    - name: Firmar APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Limpiar nombre del APK firmado
      run: mv app/build/outputs/apk/debug/FullDigitalClock-signed.apk app/build/outputs/apk/debug/FullDigitalClock.apk
      
    - name: Guardar y mostrar el APK generado
      uses: actions/upload-artifact@v4.4.0 # Soluciona aviso de Node 20
      with:
        name: Full Digital Clock
        path: "app/build/outputs/apk/debug/FullDigitalClock.apk"
        retention-days: 1
        if-no-files-found: error
